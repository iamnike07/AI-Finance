version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: investor_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: investor
      POSTGRES_PASSWORD: investor_dev_password
      POSTGRES_DB: investor_platform
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

volumes:
  pgdata:
